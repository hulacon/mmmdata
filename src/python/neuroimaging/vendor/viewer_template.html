<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --bg:#101014; --panel:#1a1a22; --ink:#e8e8ee; --dim:#9a9aa8;
          --edge:#2c2c38; --accent:#7aa2ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.45 system-ui, sans-serif;
         display:flex; flex-direction:column; height:100vh; }
  header { padding:8px 14px; border-bottom:1px solid var(--edge);
           display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .hint { color:var(--dim); font-size:12px; }
  main { flex:1; display:flex; min-height:0; }
  #viewport { flex:1; position:relative; min-width:0; }
  canvas { outline:none; }
  aside { width:240px; padding:10px 12px; border-left:1px solid var(--edge);
          background:var(--panel); overflow-y:auto; flex-shrink:0; }
  aside h2 { font-size:11px; text-transform:uppercase; letter-spacing:.08em;
             color:var(--dim); margin:14px 0 6px; }
  aside h2:first-child { margin-top:2px; }
  label.row { display:flex; align-items:center; gap:7px; padding:3px 0;
              cursor:pointer; overflow-wrap:anywhere; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  button { background:#26263280; color:var(--ink); border:1px solid var(--edge);
           border-radius:6px; padding:5px 10px; cursor:pointer; font:inherit;
           font-size:13px; }
  button:hover { border-color:var(--accent); }
  #wheelbox { display:none; margin-top:6px; text-align:center; }
  #wheelbox .cap { font-size:11px; color:var(--dim); margin-top:2px; }
  #threshcap { font-size:11px; color:var(--dim); margin-top:2px; }
  /* key above value: the panel is narrow and both halves can be long
     (a 17-network parcel name, "MNI152NLin2009cAsym mm") */
  /* pinned at the top of the panel: a GLM bundle's overlay list can be
     dozens of rows, and the readout must not scroll away beneath it */
  #readoutbox { position:sticky; top:-10px; z-index:1; background:var(--panel);
                margin:-10px -12px 0; padding:10px 12px 8px;
                border-bottom:1px solid var(--edge); }
  #readoutbox h2 { margin-top:2px; }
  #readout { font-size:12px; display:flex; flex-direction:column; }
  #readout .k { color:var(--dim); font-size:11px; margin-top:5px; }
  #readout .k:first-child { margin-top:0; }
  #readout .v { overflow-wrap:anywhere; font-variant-numeric:tabular-nums; }
  #readout .note { color:#e0b060; font-size:11px; margin-top:5px; }
  footer { padding:5px 14px; border-top:1px solid var(--edge); font-size:12px;
           color:var(--dim); display:flex; gap:16px; min-height:28px; }
  footer #status.err { color:#ff8484; }
  #loc { margin-left:auto; text-align:right; white-space:pre; }
  details#about { font-size:12px; color:var(--dim); }
  details#about pre { white-space:pre-wrap; overflow-wrap:anywhere; }
</style>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <span class="hint" id="hint"></span>
</header>
<main>
  <div id="viewport"><canvas id="gl"></canvas></div>
  <aside>
    <div id="readoutbox" style="display:none">
      <h2>At crosshair</h2>
      <div id="readout"></div>
    </div>
    <h2 id="overlaytitle">Overlay</h2>
    <div id="layers"></div>
    <div id="variantbox" style="display:none">
      <h2 id="varianttitle">Variant</h2>
      <div id="variants"></div>
    </div>
    <h2>Opacity</h2>
    <input type="range" id="alpha" min="0" max="1" step="0.05">
    <div id="threshbox" style="display:none">
      <h2>Threshold</h2>
      <input type="range" id="thresh">
      <div id="threshcap"></div>
    </div>
    <div id="views" style="display:none">
      <h2>View</h2>
      <div id="viewbtns" style="display:flex;gap:5px;flex-wrap:wrap"></div>
    </div>
    <div id="wheelbox">
      <canvas id="wheel" width="130" height="130"></canvas>
      <div class="cap">polar angle — deg CCW from right<br>horizontal meridian</div>
    </div>
    <h2>Bundle</h2>
    <button id="savenvd" title="Export a NiiVue document (.nvd) for FreeBrowse — works over file://, inert inside a sandboxed artifact page">Save .nvd</button>
    <h2>About</h2>
    <details id="about"><summary>provenance</summary><pre id="notes"></pre></details>
  </aside>
</main>
<footer><span id="status">initializing…</span><span id="loc"></span></footer>

<script>__NIIVUE_JS__</script>
<script>
"use strict";
const CONFIG = __CONFIG_JSON__;
const $ = id => document.getElementById(id);
const status = (msg, err) => { const s = $("status");
  s.textContent = msg; s.className = err ? "err" : ""; };
window.addEventListener("error", e => status("ERROR: " + e.message, true));
window.addEventListener("unhandledrejection",
  e => status("ERROR: " + (e.reason && e.reason.message || e.reason), true));

function toBuffer(b64) {
  const bin = atob(b64), a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a.buffer;
}

function drawWheel() {
  const c = $("wheel"), g = c.getContext("2d");
  const R = c.width / 2, r0 = R * 0.45;
  for (let d = 0; d < 360; d++) {
    // screen y is flipped: math-CCW angle d maps to canvas angle -d
    g.beginPath();
    g.arc(R, R, R - 14, (-d - 1.5) * Math.PI / 180, -d * Math.PI / 180);
    g.arc(R, R, r0, -d * Math.PI / 180, (-d - 1.5) * Math.PI / 180, true);
    g.closePath();
    g.fillStyle = `hsl(${d},100%,50%)`;
    g.fill();
  }
  g.fillStyle = "#e8e8ee"; g.font = "10px system-ui";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("0", 2 * R - 7, R); g.fillText("90", R, 7);
  g.fillText("180", 8, R); g.fillText("270", R, 2 * R - 7);
}

const nv = new niivue.Niivue({
  backColor: [0.063, 0.063, 0.078, 1],
  show3Dcrosshair: CONFIG.mode === "volume",
  isColorbar: true,
  isAlphaClipDark: true,           // volume overlays: hide below cal_min
  multiplanarShowRender: niivue.SHOW_RENDER.ALWAYS,
});
nv.onLocationChange = d => {
  if (CONFIG.mode === "volume") renderReadout(d);
  else $("loc").textContent = (d && d.string) || "";
};

// "At crosshair" box (volume mode): the ACTIVE map only — never a hidden
// selector sibling. Each overlay's `readout` (from mmmview) says how to
// describe its value: a region name, a quantity with units, or the signed
// value of a stat map split into +/− tail layers.
const SENTINEL = -1;                    // viewer.MASK_SENTINEL
const fmtNum = v => {
  const a = Math.abs(v);
  return a >= 1000 || (a > 0 && a < 0.001) ? v.toExponential(2)
    : String(Number(v.toPrecision(a >= 100 ? 4 : 3)));
};
function valueAt(d, e) {
  const vi = nvIndex.get(e.i);
  return vi !== undefined && d.values && d.values[vi]
    ? d.values[vi].value : null;
}
// voxel indices in the FILE's own grid (i, j, k as nibabel would index
// it), or null when the point falls outside that grid
function fileVoxel(vol, mm) {
  if (!vol || !vol.grid) return null;
  const M = vol.grid.mm2vox, p = [mm[0], mm[1], mm[2], 1];
  const ijk = M.map(row => Math.round(row.reduce((s, m, k) => s + m * p[k], 0)));
  return ijk.every((n, k) => n >= 0 && n < vol.grid.shape[k]) ? ijk : null;
}
function renderReadout(d) {
  const box = $("readout");
  if (!d || !d.values) return;
  const rows = [];
  const add = (k, v) => rows.push([k, v]);
  const notes = [];
  const a = activeEntry();
  if (!a) add("map", "none selected");
  else {
    const r = a.readout || { kind: "value", quantity: null, unit: "",
                             masked: "no data" };
    add("map", a.label + (hasVariants ? " · " + activeVariant : ""));
    const inside = !a.grid || !d.mm || fileVoxel(a, d.mm) !== null;
    const v = inside ? valueAt(d, a) : null;
    const floor = a.i in thr ? thr[a.i] : (a.cal_min === null ? 0 : a.cal_min);
    if (v === null) add(r.quantity || (a.lut ? "region" : "value"),
                        inside ? "—" : "outside map");
    else if (a.lut) {
      const n = Math.round(v), j = a.lut.I.indexOf(n);
      add("region", n > 0 ? (j >= 0 ? a.lut.labels[j] : "index " + n)
                          : "outside regions");
    } else if (r.kind === "tail") {
      const sib = entries().find(e => e.i !== a.i && e.readout &&
        e.readout.kind === "tail" && e.readout.group === r.group &&
        (!hasVariants || e.variant === a.variant));
      const sv = sib ? valueAt(d, sib) : null;
      if (v !== SENTINEL) {
        add(r.quantity, fmtNum(r.sign * v));
        if (v < floor) notes.push("below display threshold");
      } else if (sv !== null && sv !== SENTINEL) {
        add(r.quantity, fmtNum(sib.readout.sign * sv));
        notes.push("on the " + (sib.readout.sign > 0 ? "+" : "−") +
                   " layer, not this one");
      } else add(r.quantity, "no data");
    } else if (v === SENTINEL) add(r.quantity || "value", r.masked || "no data");
    else {
      add(r.quantity || "value", fmtNum(v) + (r.unit || ""));
      if (v < floor) notes.push("below display threshold");
    }
  }
  const U = CONFIG.volumes.find(v => v.isUnderlay);
  const uv = d.mm && fileVoxel(U, d.mm);
  if (uv) add("slice", uv.join(", "));
  if (a && d.mm && a.grid) {
    const mv = fileVoxel(a, d.mm);
    const sameGrid = JSON.stringify(a.grid) === JSON.stringify(U.grid);
    if (!sameGrid) add("map voxel", mv ? mv.join(", ") : "outside map");
  }
  if (d.mm) add(CONFIG.coord_label || "mm",
                Array.from(d.mm).slice(0, 3)
                  .map(x => (Math.abs(x) < 0.05 ? 0 : x).toFixed(1)).join(", "));
  box.replaceChildren();
  for (const [k, v] of rows) {
    const kk = document.createElement("span"); kk.className = "k";
    kk.textContent = k;
    const vv = document.createElement("span"); vv.className = "v";
    vv.textContent = v;
    box.append(kk, vv);
  }
  for (const n of notes) {
    const nn = document.createElement("span"); nn.className = "note";
    nn.textContent = n;
    box.append(nn);
  }
}

// Exclusive stat-layer toggle; shade layers and the underlay stay put.
// The toggle is two-dimensional when entries carry a variant (several map
// families of the same parameters in one bundle): Overlay picks the
// parameter (label), Variant picks the family, and the active entry is
// the (label, variant) pair. Entries keep their stable CONFIG index i.
function entries() {
  return CONFIG.mode === "volume"
    ? CONFIG.volumes.map((v, i) => ({ ...v, i })).filter(v => !v.isUnderlay)
    : CONFIG.meshes[0].layers.map((l, i) => ({ ...l, i })).filter(l => !l.shade);
}
const uniq = xs => [...new Set(xs)];
const VARIANTS = uniq(entries().map(e => e.variant).filter(v => v != null));
const hasVariants = VARIANTS.length > 1;
let activeParam = null;                 // label of the active overlay
let activeVariant = VARIANTS[0] || null;
function activeEntry() {
  return entries().find(e => e.label === activeParam &&
    (!hasVariants || e.variant === activeVariant)) || null;
}

// Volume mode decodes lazily: only the underlay plus the active variant's
// maps are resident (four variants all-resident would be ~4x the memory
// for maps that are hidden anyway). nvIndex maps a CONFIG index to the
// entry's current position in nv.volumes. Surface layers are per-vertex
// and cheap, so they all load up front as before.
let loadedVariant;                      // undefined until the first load
const nvIndex = new Map();
async function loadVariant(v) {
  if (loadedVariant === v) return;
  while (nv.volumes.length > 1) nv.removeVolume(nv.volumes[1]);
  nvIndex.clear();
  for (const e of entries()) {
    if (hasVariants && e.variant !== v) continue;
    const img = await niivue.NVImage.loadFromBase64({
      base64: e.base64, name: e.name });
    img.colormap = e.colormap;
    if (e.lut) img.setColormapLabel(e.lut);    // named integer regions
    img.cal_min = e.i in thr ? thr[e.i]           // threshold survives the
      : (e.cal_min === null ? 0 : e.cal_min);     // variant switch
    if (e.cal_max !== null) img.cal_max = e.cal_max;
    img.opacity = 0;
    img.colorbarVisible = false;
    nvIndex.set(e.i, nv.volumes.length);
    nv.addVolume(img);
  }
  loadedVariant = v;
}

async function applyActive() {
  const alpha = parseFloat($("alpha").value);
  if (CONFIG.mode === "volume") await loadVariant(activeVariant);
  for (const e of entries()) {
    const on = e.label === activeParam &&
      (!hasVariants || e.variant === activeVariant);
    if (CONFIG.mode === "volume") {
      const vi = nvIndex.get(e.i);
      if (vi === undefined) continue;   // not the loaded variant
      nv.volumes[vi].colorbarVisible = on && !e.lut;
      nv.setOpacity(vi, on ? alpha : 0);
    } else {
      const id = nv.meshes[0].id;
      nv.setMeshLayerProperty(id, e.i, "colorbarVisible", on ? 1 : 0);
      nv.setMeshLayerProperty(id, e.i, "opacity", on ? alpha : 0);
    }
  }
  const a = activeEntry();
  $("wheelbox").style.display = a && a.angle_legend ? "block" : "none";
  nv.updateGLVolume();
  syncThresh();
  if (CONFIG.mode === "volume") nv.createOnLocationChange();
}

// Live threshold = the active layer's cal_min. The bundle embeds the full
// map; cal_min only clips display (isAlphaClipDark for volumes, the layer
// clip for mesh layers), so sliding to 0 shows it unthresholded. Hidden
// for angle layers (hsv is cyclic — a floor on degrees is meaningless)
// and per-layer: each stat layer keeps its own threshold across toggles.
const thr = {};  // CONFIG index -> current cal_min
const fmtThr = v => "show ≥ " + (+v).toPrecision(3);
function syncThresh() {
  const t = activeEntry();
  const usable = t && !t.angle_legend && t.cal_max !== null;
  $("threshbox").style.display = usable ? "block" : "none";
  if (!usable) return;
  if (!(t.i in thr)) thr[t.i] = t.cal_min === null ? 0 : t.cal_min;
  const s = $("thresh");
  s.min = 0; s.max = t.cal_max; s.step = t.cal_max / 200 || 0.01;
  s.value = thr[t.i];
  $("threshcap").textContent = fmtThr(thr[t.i]);
}
$("thresh").addEventListener("input", () => {
  const t = activeEntry();
  if (!t) return;
  const v = parseFloat($("thresh").value);
  thr[t.i] = v;
  if (CONFIG.mode === "volume") {
    const vi = nvIndex.get(t.i);
    if (vi === undefined) return;
    nv.volumes[vi].cal_min = v;
  } else nv.setMeshLayerProperty(nv.meshes[0].id, t.i, "cal_min", v);
  nv.updateGLVolume();
  $("threshcap").textContent = fmtThr(v);
  if (CONFIG.mode === "volume") nv.createOnLocationChange();
});
function buildControls() {
  if (CONFIG.overlay_title) $("overlaytitle").textContent = CONFIG.overlay_title;
  if (CONFIG.variant_title) $("varianttitle").textContent = CONFIG.variant_title;
  const mkRadio = (box, group, label, checked, onpick) => {
    const l = document.createElement("label"); l.className = "row";
    const r = document.createElement("input");
    r.type = "radio"; r.name = group; r.checked = checked;
    r.addEventListener("change", onpick);
    l.append(r, document.createTextNode(label));
    box.append(l);
  };
  const box = $("layers");
  mkRadio(box, "layer", "none", activeParam === null,
          () => { activeParam = null; applyActive(); });
  for (const p of uniq(entries().map(e => e.label)))
    mkRadio(box, "layer", p, p === activeParam,
            () => { activeParam = p; applyActive(); });
  if (!hasVariants) return;
  $("variantbox").style.display = "block";
  for (const v of VARIANTS)
    mkRadio($("variants"), "variant", v, v === activeVariant,
            () => { activeVariant = v; applyActive(); });
}

async function init() {
  nv.attachToCanvas($("gl"));
  if (CONFIG.mode === "volume") {
    $("hint").textContent =
      "click: crosshair · scroll: slice · right-drag: zoom · drag render view: rotate";
    // underlay only; applyActive lazy-loads the active variant's overlays
    const u = CONFIG.volumes.find(v => v.isUnderlay);
    const img = await niivue.NVImage.loadFromBase64({
      base64: u.base64, name: u.name });
    img.colormap = u.colormap;
    if (u.cal_min !== null) img.cal_min = u.cal_min;
    if (u.cal_max !== null) img.cal_max = u.cal_max;
    img.opacity = 1;
    img.colorbarVisible = false;
    nv.addVolume(img);
    nv.setSliceType(nv.sliceTypeMultiplanar);
    $("readoutbox").style.display = "block";
  } else {
    $("hint").textContent = "drag: rotate · scroll: zoom · right-drag: pan";
    const m = CONFIG.meshes[0];
    const layers = m.layers.map(l => {
      const spec = { name: l.name, base64: l.base64, colormap: l.colormap,
                     cal_min: l.cal_min === null ? 0 : l.cal_min,
                     opacity: l.shade ? l.opacity : 0 };
      if (l.cal_max !== null) spec.cal_max = l.cal_max;
      return spec;
    });
    await nv.loadMeshes([{
      url: m.name, buffer: toBuffer(m.base64),
      rgba255: [205, 205, 205, 255], layers }]);
    const id = nv.meshes[0].id;
    nv.setMeshShader(id, "Phong");
    // Post-load property fixes (loadLayer forwards only some options, and
    // its readLayer treats cal_min 0 as UNSET, substituting the data min —
    // which is the -1 mask sentinel, un-hiding every masked vertex):
    m.layers.forEach((l, i) => {
      nv.setMeshLayerProperty(id, i, "colorbarVisible", 0);
      nv.setMeshLayerProperty(id, i, "colormapNegative", "");  // else a
      // spurious negative colorbar is drawn beside the active layer's
      nv.setMeshLayerProperty(id, i, "cal_min",
                              l.cal_min === null ? 0 : l.cal_min);
    });
    nv.setSliceType(nv.sliceTypeRender);
    // view presets; azimuth convention verified against rendered anatomy
    // (lh az 270 faces the medial wall — corpus callosum check; az 0 is a
    // camera at the posterior pole, so anterior needs 180)
    const lh = m.name.startsWith("lh");
    const views = { lateral: lh ? 90 : 270, medial: lh ? 270 : 90,
                    posterior: 0, anterior: 180 };
    $("views").style.display = "block";
    for (const [label, az] of Object.entries(views)) {
      const b = document.createElement("button");
      b.textContent = label;
      b.addEventListener("click", () => nv.setRenderAzimuthElevation(az, 0));
      $("viewbtns").append(b);
    }
    nv.setRenderAzimuthElevation(views.medial, 0);
  }
  const first = entries().find(e => e.visible);
  activeParam = first ? first.label : null;
  if (hasVariants && first) activeVariant = first.variant;
  $("alpha").value = first ? first.opacity : 0.8;
  buildControls();
  await applyActive();
  drawWheel();
  $("notes").textContent = CONFIG.notes || "(none)";
  status("NiiVue " + (nv.version || "") + " — " + CONFIG.mode + " mode, " +
    (CONFIG.mode === "volume"
      ? CONFIG.volumes.length + " volumes" +
        (hasVariants ? " (" + VARIANTS.length + " variants, on demand)" : "")
      : "1 mesh, " + CONFIG.meshes[0].layers.length + " layers"));
}
$("alpha").addEventListener("input", applyActive);
$("savenvd").addEventListener("click", async () => {
  try { await nv.saveDocument((CONFIG.title || "viewer") + ".nvd"); }
  catch (e) { status("Save .nvd failed: " + e.message, true); }
});
init().catch(e => status("INIT ERROR: " + e.message, true));
</script>
</body>
</html>
