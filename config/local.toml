# Local overrides for base.toml. Deep-merged over base by
# core.config.load_config(), so only the keys listed here change.
#
# This file previously re-spelled four [paths] keys with the `/gpfs`
# prefix, because base.toml had them in the bare `/projects/...` form
# that is invisible inside some sandboxed harnesses. base.toml carries
# the resolved form itself now, so those overrides are gone: base is
# correct at source rather than patched here.
#
# Note this file is tracked in git (unlike mmmdata-agents', which is
# ignored), so anything added here applies to every operator, not just
# you. Keep genuinely per-operator settings out of it, or untrack it.

# Example: point at a local copy of the dataset when working off-cluster
# [paths]
# bids_project_dir = "/path/to/your/mmmdata"

# Example: set your email for SLURM notifications
# [slurm]
# email = "your.email@domain.com"
