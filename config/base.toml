# This file contains base configuration settings (edit local.toml to override)
#
# Absolute paths use the fully resolved `/gpfs/projects/hulacon/...`
# form. The bare `/projects/hulacon/...` form is not a synonym: it
# resolves on login and compute nodes but not inside every sandboxed
# harness, so tools reading these keys raised FileNotFoundError on a
# path that plainly existed. Four keys here were missed when the rest
# were converted and were being patched by a committed local.toml;
# they are correct at source now. Guarded by tests/test_portability.py.

[paths]
# Main BIDS dataset directory
bids_project_dir = "/gpfs/projects/hulacon/shared/mmmdata"

# Raw source data directory (pre-BIDS conversion inputs)
source_dir = "/gpfs/projects/hulacon/shared/mmmsourcedata"

# Code repository root (where this config file is located)
code_root = "/gpfs/projects/hulacon/shared/mmmdata/code/mmmdata"

# Singularity/Apptainer images directory. Lives outside the BIDS tree and
# outside any one project: the images are shared infrastructure like
# ../envs/, several projects run them, and they must not ship with the
# dataset on public release. Moved here from code/containers 2026-08-20.
singularity_dir = "/gpfs/projects/hulacon/shared/containers"

# Python virtual environment directory
venv_dir = "/gpfs/projects/hulacon/shared/mmmdata/code/mmmdata/.venv"

# Output directories
output_dir = "/gpfs/projects/hulacon/shared/mmmdata/derivatives"
inventory_dir = "/gpfs/projects/hulacon/shared/mmmdata/inventory"

# Shared scratch root for pipeline work trees. Everything under it is swept
# nightly by scripts/clean_shared_work.sh (scrontab): any run dir with no file
# modified for 7 days is deleted. Keep only disposable intermediates here.
shared_work_root = "/gpfs/projects/hulacon/shared/work"

# Working directory for pipeline intermediate files. fMRIPrep >= 25.2 refuses
# to start if this is inside bids_project_dir. Environment variables are
# expanded at load time; the $USER level keeps operators from clobbering each
# other. Must stay under shared_work_root, or the nightly reaper cannot cap
# its disk usage. Work dirs here survive crashes (fMRIPrep can resume), and
# the fmriprep sbatch wrappers delete their run's work dir on success.
work_dir = "/gpfs/projects/hulacon/shared/work/$USER/mmmdata_work"

[qc]
# Quality-control thresholds. See docs/doc/qc-guidance.md for what each
# measure means and what the literature does (and does not) support.

# Framewise displacement (mm) above which a volume counts as high-motion.
# Note: this is a run-summary convenience threshold, not a published
# exclusion criterion. Power et al. (2012) used 0.5 mm for censoring
# individual frames; the citable run-level rule is Parkes et al. (2018)
# (mean FD > 0.25 mm, or >20% of frames above 0.2 mm).
fd_threshold = 0.5

# Mean FD (mm) above which the auto-stub generator recommends 'investigate'
# rather than 'keep'. A recommendation only — it is never a sign-off.
investigate_threshold = 0.5

# Multiplier for the Tukey IQR fence used to flag outlier runs.
# 1.5 is the standard fence; 3.0 flags only extreme values.
iqr_multiplier = 1.5

[slurm]
# Default SLURM configuration
partition = "medium"
time = "12:00:00"
memory = "16G"
cpus = "4"

# Email notifications (override in local.toml with your email)
email = "your.email@example.com"
mail_type = "END,FAIL"