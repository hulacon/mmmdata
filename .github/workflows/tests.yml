# Off-cluster test CI for mmmdata.
#
# Separate from ci.yml, which builds the Jekyll docs site and only runs on
# docs/** changes -- until now nothing ran the Python suite on a push.
#
# The dataset lives on Talapas GPFS and a GitHub runner cannot see it, so
# this runs the host-independent tier: everything that works from fixtures
# and tmp_path. Tests marked `requires_dataset` skip themselves
# (conftest.py); they are the cluster's job, not CI's.
#
# Dependencies come from pyproject.toml (the `test` extra), the one list
# every consumer installs from. Everything there is pip-installable and
# CPU-only -- no torch, which is why the stimulus-feature work is not in
# scope for this workflow.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
        with:
          # docs/doc/shared is the mmmdata-docs submodule; the suite does
          # not read it and a fresh clone leaves it empty.
          submodules: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The dependency list lives in pyproject.toml, so that is what the
      # cache key hashes: the install changes exactly when it changes.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Confirm the runner has neither GPFS nor SLURM
        # If either appeared, the suite would silently start exercising a
        # different tier and this workflow would stop testing what it claims.
        run: |
          test ! -d /gpfs/projects/hulacon || { echo "GPFS present on runner"; exit 1; }
          ! command -v sbatch >/dev/null || { echo "SLURM present on runner"; exit 1; }

      - name: Test (off-cluster tier)
        # No PYTHONPATH: the editable install puts src/python on the path.
        # A clone with no install relies on conftest.py's bootstrap instead.
        run: pytest -q -rs

      - name: MCP launcher starts off-cluster
        # The suite builds the server in-process; this exercises the
        # bin/mmmdata-mcp path an MCP client actually spawns. Import-time
        # dataset access would fail here.
        env:
          MMMDATA_MCP_PYTHON: python
        run: bin/mmmdata-mcp --list-toolsets

      - name: A pinned install works without a clone
        # What a project gets from `mmmdata @ git+...@<ref>`: a wheel, run
        # from outside the checkout, so config comes from the packaged
        # base.toml and nothing can be found by walking up to the repo.
        run: |
          pip wheel --no-deps -w "$RUNNER_TEMP/wheel" .
          python -m venv "$RUNNER_TEMP/pinned"
          "$RUNNER_TEMP/pinned/bin/pip" install --quiet "$RUNNER_TEMP"/wheel/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pinned/bin/python" - <<'PY'
          from core.config import _find_config_dir, load_config
          import mmmget
          from resultsview import page
          assert _find_config_dir().parts[-2:] == ("core", "default_config")
          assert load_config()["paths"]["bids_project_dir"]
          assert (page.VENDOR_DIR / "vega.min.js").is_file()
          print("pinned install OK, mmmget", mmmget.__version__)
          PY
