name: Docs CI

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "src/python/**"
      - "scripts/mmmview.py"
      - "scripts/generate_docs.py"
      - "scripts/update_docs.sh"
  pull_request:
    paths:
      - "docs/**"
      - "src/python/**"
      - "scripts/mmmview.py"
      - "scripts/generate_docs.py"
      - "scripts/update_docs.sh"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          cache-version: 0
          working-directory: '${{ github.workspace }}/docs'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate code documentation
        # docs/doc/code/ is gitignored: pages are built from docstrings on
        # every deploy so they cannot drift from the code. Stdlib only.
        working-directory: ${{ github.workspace }}
        run: bash scripts/update_docs.sh
      - name: Build with Jekyll
        run: bundle exec jekyll build
